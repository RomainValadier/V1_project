<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RR Clean Viewer</title>
  <script src="./plotly.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #13231a;
    }
    #root { padding: 6px 0 0 0; }
    #toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 8px 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(27, 67, 50, 0.12);
      box-shadow: 0 8px 20px rgba(30, 41, 59, 0.06);
      font-size: 13px;
      line-height: 1.4;
    }
    #chart-wrap {
      position: relative;
      width: 100%;
      min-height: 440px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(27, 67, 50, 0.10);
    }
    #chart { width: 100%; height: 440px; }
    #fullscreen-btn {
      border: 0;
      border-radius: 999px;
      background: #173427;
      color: #ffffff;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    #fullscreen-btn:hover {
      background: #24533c;
    }
    #footer-note {
      margin-top: 8px;
      font-size: 12px;
      color: #475569;
    }
    :fullscreen #chart-wrap,
    :-webkit-full-screen #chart-wrap {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }
    :fullscreen #chart,
    :-webkit-full-screen #chart {
      height: calc(100vh - 12px);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="toolbar">
      <div id="summary">Chargement du graphe RR clean...</div>
      <button id="fullscreen-btn" type="button">Plein ecran</button>
    </div>
    <div id="chart-wrap">
      <div id="chart"></div>
    </div>
    <div id="footer-note">Glisse pour deplacer, molette pour zoomer, double-clic pour reinitialiser. Le bouton ouvre le graphe en plein ecran.</div>
  </div>

  <script>
    const MIN_FRAME_HEIGHT = 520;

    const state = {
      linePoints: [],
      correctedPoints: [],
      excludedPoints: [],
      denseBoxes: [],
      excludedBoxes: [],
      baseLinePoints: [],
      chartTitle: 'RR clean',
      graphDiv: null,
    };

    const summaryEl = document.getElementById('summary');
    const chartWrapEl = document.getElementById('chart-wrap');
    const chartEl = document.getElementById('chart');
    const fullscreenBtnEl = document.getElementById('fullscreen-btn');

    function postMessageToStreamlit(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*');
    }

    function setFrameHeight(height) {
      postMessageToStreamlit('streamlit:setFrameHeight', { height: Math.max(height, MIN_FRAME_HEIGHT) });
    }

    function componentReady() {
      postMessageToStreamlit('streamlit:componentReady', { apiVersion: 1 });
    }

    function makeTrace(points, options) {
      return {
        type: options.type || 'scatter',
        mode: options.mode || 'markers',
        name: options.name,
        x: points.map(point => point.t_min == null ? null : Number(point.t_min)),
        y: points.map(point => point.display_rr_ms == null ? null : Number(point.display_rr_ms)),
        customdata: points.map(point => [
          String(point.label || ''),
          String(point.label_2bis || ''),
          String(point.correction_flag || ''),
          String(point.run_flag || ''),
          String(point.run_series_flag || ''),
          String(point.segment_status || ''),
        ]),
        marker: options.marker || undefined,
        line: options.line || undefined,
        hovertemplate: options.hovertemplate || [
          'Temps %{x:.3f} min',
          'RR %{y:.1f} ms',
          'Label %{customdata[0]}',
          'Label 2 bis %{customdata[1]}',
          'Correction %{customdata[2]}',
          'Run %{customdata[3]}',
          'Run serie %{customdata[4]}',
          'Segment %{customdata[5]}',
          '<extra></extra>',
        ].join('<br>'),
        showlegend: options.showlegend !== false,
      };
    }

    function buildDisconnectedLineTrace(points, options) {
      if (!points.length) {
        return null;
      }
      const x = [];
      const y = [];
      let previousGroup = null;

      points.forEach(point => {
        const rawGroup = Number(point.line_group);
        const groupKey = Number.isFinite(rawGroup) ? rawGroup : 0;
        if (previousGroup !== null && groupKey !== previousGroup) {
          x.push(null);
          y.push(null);
        }
        x.push(point.t_min == null ? null : Number(point.t_min));
        y.push(point.display_rr_ms == null ? null : Number(point.display_rr_ms));
        previousGroup = groupKey;
      });

      return {
        type: 'scatter',
        mode: 'lines',
        name: options.name,
        x,
        y,
        line: options.line || undefined,
        hovertemplate: options.hovertemplate || 'Temps %{x:.3f} min<br>RR %{y:.1f} ms<br><extra></extra>',
        showlegend: options.showlegend !== false,
      };
    }

    function updateSummary() {
      const excludedCount = state.excludedBoxes.length || state.excludedPoints.length;
      summaryEl.innerHTML = `<strong>${state.chartTitle}</strong> - ${state.linePoints.length} points visibles, ${state.correctedPoints.length} point(s) corriges, ${excludedCount} zone(s) exclues.`;
    }

    function buildShapes() {
      const denseShapes = state.denseBoxes.map(box => ({
        type: 'rect',
        xref: 'x',
        yref: 'y',
        x0: Number(box.x_start),
        x1: Number(box.x_end),
        y0: Number(box.y_min),
        y1: Number(box.y_max),
        fillcolor: 'rgba(20,184,166,0.10)',
        line: {
          color: '#0f766e',
          width: 2,
          dash: 'dash',
        },
      }));
      const excludedShapes = state.excludedBoxes.map(box => ({
        type: 'rect',
        xref: 'x',
        yref: 'paper',
        x0: Number(box.x_start),
        x1: Number(box.x_end),
        y0: 0,
        y1: 1,
        fillcolor: 'rgba(71,85,105,0.10)',
        line: {
          color: '#475569',
          width: 1.5,
          dash: 'dot',
        },
        layer: 'below',
      }));
      return [...excludedShapes, ...denseShapes];
    }

    function renderFigure() {
      updateSummary();

      try {
        const traces = [];

        const baseLineTrace = buildDisconnectedLineTrace(state.baseLinePoints, {
          name: 'RR clean pre-2 bis',
          line: { color: '#94a3b8', width: 1.8, dash: 'dash' },
          hovertemplate: 'Temps %{x:.3f} min<br>RR %{y:.1f} ms<br><extra></extra>',
        });
        if (baseLineTrace) {
          traces.push(baseLineTrace);
        }

        const lineTrace = buildDisconnectedLineTrace(state.linePoints, {
          name: 'RR clean',
          line: { color: '#2d5f43', width: 2.4 },
          hovertemplate: 'Temps %{x:.3f} min<br>RR %{y:.1f} ms<br><extra></extra>',
        });
        if (lineTrace) {
          traces.push(lineTrace);
        }

        const correctionStyles = {
          division: { color: '#1d4ed8', symbol: 'circle' },
          fusion: { color: '#b45309', symbol: 'square' },
          interpolation_pchip: { color: '#be123c', symbol: 'diamond' },
          interpolation_lineaire: { color: '#7c3aed', symbol: 'triangle-up' },
        };

        Object.keys(correctionStyles).forEach(flag => {
          const points = state.correctedPoints.filter(point => point.correction_flag === flag);
          if (!points.length) {
            return;
          }
          const style = correctionStyles[flag];
          traces.push(makeTrace(points, {
            name: flag,
            marker: { size: 11, color: style.color, symbol: style.symbol, line: { color: '#ffffff', width: 1.1 } },
          }));
        });

        const layout = {
          margin: { l: 62, r: 18, t: 20, b: 48 },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor: 'rgba(0,0,0,0)',
          hovermode: 'closest',
          dragmode: 'pan',
          showlegend: true,
          xaxis: {
            title: 'Temps cumule clean (min)',
            zeroline: false,
            gridcolor: 'rgba(148,163,184,0.18)',
            fixedrange: false,
          },
          yaxis: {
            title: 'RR clean (ms)',
            zeroline: false,
            gridcolor: 'rgba(148,163,184,0.18)',
            fixedrange: false,
          },
          shapes: buildShapes(),
        };

        Plotly.newPlot(chartEl, traces, layout, {
          responsive: true,
          displaylogo: false,
          scrollZoom: true,
          modeBarButtonsToRemove: ['select2d', 'lasso2d'],
        }).then(graphDiv => {
          state.graphDiv = graphDiv;
          setFrameHeight(document.body.scrollHeight + 12);
        }).catch(error => {
          summaryEl.innerHTML = `<strong>${state.chartTitle}</strong> - erreur de rendu`;
          chartEl.innerHTML = "<div style=\"padding:16px; color:#7f1d1d; font-size:12px;\">Le graphe RR clean n'a pas pu s'afficher.</div>";
          setFrameHeight(document.body.scrollHeight + 12);
          throw error;
        });
      } catch (error) {
        summaryEl.innerHTML = `<strong>${state.chartTitle}</strong> - erreur de rendu`;
        chartEl.innerHTML = "<div style=\"padding:16px; color:#7f1d1d; font-size:12px;\">Le graphe RR clean n'a pas pu s'afficher.</div>";
        setFrameHeight(document.body.scrollHeight + 12);
        throw error;
      }
    }

    function applyRenderArgs(args) {
      state.linePoints = Array.isArray(args.line_points) ? args.line_points : [];
      state.correctedPoints = Array.isArray(args.corrected_points) ? args.corrected_points : [];
      state.excludedPoints = Array.isArray(args.excluded_points) ? args.excluded_points : [];
      state.denseBoxes = Array.isArray(args.dense_boxes) ? args.dense_boxes : [];
      state.excludedBoxes = Array.isArray(args.excluded_boxes) ? args.excluded_boxes : [];
      state.baseLinePoints = Array.isArray(args.base_line_points) ? args.base_line_points : [];
      state.chartTitle = String(args.chart_title || 'RR clean');
      renderFigure();
    }

    fullscreenBtnEl.addEventListener('click', () => {
      const target = chartWrapEl;
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
        return;
      }
      target.requestFullscreen?.();
    });

    document.addEventListener('fullscreenchange', () => {
      if (state.graphDiv) {
        Plotly.Plots.resize(state.graphDiv);
      }
      setTimeout(() => setFrameHeight(document.body.scrollHeight + 12), 80);
    });

    window.addEventListener('message', event => {
      const data = event.data || {};
      if (data.type !== 'streamlit:render') {
        return;
      }
      applyRenderArgs(data.args || {});
    });

    window.addEventListener('load', () => {
      componentReady();
      setFrameHeight(document.body.scrollHeight + 12);
    });
  </script>
</body>
</html>
